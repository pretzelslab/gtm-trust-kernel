version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A compiler major is a deliberate upgrade, not a weekly bump.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types should track the Node version in engines, not the latest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
